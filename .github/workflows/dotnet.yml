name: .NET build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Relicbound.slnx
      - name: Build
        run: dotnet build Relicbound.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Relicbound.slnx --configuration Release --no-build --no-restore
